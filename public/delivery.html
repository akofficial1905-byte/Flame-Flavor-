<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flame And Flavor — Delivery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self';">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --navy:#1A2B42;--navy2:#2D4A7A;--amber:#D97706;--warn:#F59E0B;
    --green:#10B981;--red:#EF4444;--blue:#3B82F6;
    --bg:#F4F7FD;--surface:#FFFFFF;--surface2:#EAF0FB;--border:#C8D8F0;
    --text:#1E293B;--muted:#64748B;
  }
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ── LOGIN ── */
  #loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .login-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .login-card h2{font-size:1.35rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:2px;}
  .login-card p{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:20px;}
  .form-group{margin-bottom:12px;}
  .form-label{display:block;font-size:.75rem;font-weight:700;color:var(--navy);margin-bottom:5px;}
  .form-input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;background:#fff;color:var(--text);}
  .form-input:focus{outline:none;border-color:var(--navy2);}
  .btn{border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-block{width:100%;padding:13px;font-size:.95rem;}
  .btn-primary{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;}
  .login-err{color:#991B1B;font-size:.8rem;margin-top:10px;padding:8px;background:#FEE2E2;border-radius:8px;display:none;text-align:center;}

  /* ── APP ── */
  #app{display:none;flex-direction:column;height:100%;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:12px 16px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
  header h1{color:#fff;font-size:1.1rem;font-weight:800;letter-spacing:.3px;}
  header .sub{color:rgba(255,255,255,.7);font-size:.68rem;}
  #logoutBtn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:.75rem;font-weight:700;cursor:pointer;}

  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
  .tab-btn{flex:1;padding:12px 8px;background:transparent;border:none;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;position:relative;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--navy);border-bottom-color:var(--amber);}
  .tab-count{display:inline-block;background:var(--red);color:#fff;font-size:.65rem;font-weight:800;border-radius:999px;min-width:18px;height:18px;padding:0 5px;margin-left:5px;vertical-align:middle;}

  .date-bar{padding:8px 16px;background:var(--surface2);font-size:.78rem;color:var(--navy);font-weight:700;flex-shrink:0;text-align:center;}

  #list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;}
  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;font-size:.9rem;}

  .order-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .order-card.new-flash{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.25);}
  .order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .seq-badge{background:var(--navy);color:#fff;font-weight:800;font-size:.8rem;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .order-type-badge{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:4px 9px;border-radius:6px;}
  .order-type-badge.delivery{background:#DBEAFE;color:#1E40AF;}
  .order-type-badge.takeaway{background:#FEF3C7;color:#92400E;}
  .cust-name{font-size:1.05rem;font-weight:800;color:var(--navy);margin-bottom:2px;}
  .cust-mobile{font-size:.85rem;color:var(--blue);font-weight:600;text-decoration:none;display:inline-block;margin-bottom:6px;}
  .addr-box{font-size:.8rem;color:var(--text);background:var(--surface2);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.4;}
  .items-box{font-size:.83rem;color:var(--text);margin-bottom:10px;line-height:1.7;}
  .items-box .item-row{display:flex;justify-content:space-between;}
  .items-box .item-row b{color:var(--navy);}
  .total-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1.5px dashed var(--border);margin-bottom:10px;}
  .total-row .lbl{font-size:.82rem;color:var(--muted);font-weight:700;}
  .total-row .val{font-size:1.35rem;font-weight:800;color:var(--navy);}
  .pay-badge{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:800;padding:5px 10px;border-radius:7px;margin-bottom:10px;}
  .pay-badge.prepaid{background:#D1FAE5;color:#065F46;}
  .pay-badge.cod{background:#FEF3C7;color:#92400E;}
  .actions-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .actions-row.single{grid-template-columns:1fr;}
  .btn-nav{background:var(--blue);color:#fff;padding:11px;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-deliver{background:var(--green);color:#fff;padding:11px;font-size:.85rem;}
  .collect-wrap{margin-bottom:10px;}
  .collect-wrap label{font-size:.72rem;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;display:block;}
  .collect-input{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:1.1rem;font-weight:700;color:var(--navy);}

  .delivered-tag{font-size:.72rem;color:var(--green);font-weight:800;display:flex;align-items:center;gap:4px;margin-top:4px;}

  audio{display:none;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-card">
    <h2>Delivery &amp; Takeaway</h2>
    <p>Flame And Flavor</p>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="loginUser" class="form-input" type="text" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="loginPass" class="form-input" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
    </form>
    <div id="loginError" class="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <h1>🔥 Flame And Flavor</h1>
      <div class="sub">Delivery &amp; Takeaway</div>
    </div>
    <button id="logoutBtn">Logout</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="active" onclick="switchDeliveryTab('active',this)">Active <span class="tab-count" id="activeCount" style="display:none;">0</span></button>
    <button class="tab-btn" data-tab="delivered" onclick="switchDeliveryTab('delivered',this)">Delivered <span class="tab-count" id="deliveredCount" style="display:none;background:var(--green);">0</span></button>
  </div>

  <div class="date-bar" id="dateBar">Today</div>

  <div id="list"></div>
</div>

<audio id="chimeAudio"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtRs = n => '₹'+Number(n||0).toLocaleString('en-IN');
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : '';
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());

let socket = null;
let allOrders = [];
let currentTab = 'active';

async function apiFetch(url, opts={}) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─────────────────────────────── LOGIN ───────────────────────────────
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value.trim();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Enter both fields'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const data = await apiFetch('/api/manager/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    if (data.success) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      initApp();
    } else {
      errEl.textContent = data.message || 'Invalid credentials';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = 'Connection error: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Login';
  }
};

document.getElementById('logoutBtn').onclick = () => {
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
};

// ─────────────────────────────── INIT ────────────────────────────────
function initApp() {
  document.getElementById('dateBar').textContent =
    'Today — ' + new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });
  connectSocket();
  fetchOrders();
  setInterval(fetchOrders, 30000); // safety-net refresh every 30s in case a socket event is missed
}

function connectSocket() {
  if (socket) return;
  try {
    socket = io();
    socket.on('newOrder', (order) => {
      if (order && order.orderType && order.orderType !== 'dinein') {
        playChime();
        fetchOrders(order._id);
      }
    });
    socket.on('orderUpdated', () => fetchOrders());
  } catch(e) { console.warn('Socket unavailable', e); }
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1108].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.16;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.4, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.2);
    });
  } catch(e) {}
}

// ─────────────────────────────── FETCH & FILTER ───────────────────────
let flashOrderId = null;
async function fetchOrders(newOrderId) {
  flashOrderId = newOrderId || null;
  try {
    const orders = await apiFetch(`/api/orders?date=${today()}`);
    // Only delivery & takeaway — dine-in is handled entirely through the POS/table workflow.
    allOrders = orders
      .filter(o => o.orderType === 'delivery' || o.orderType === 'takeaway')
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt)); // sequence = placement order
    render();
  } catch(e) { console.error('fetchOrders', e); }
}

function switchDeliveryTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function render() {
  const active = allOrders.filter(o => o.status !== 'delivered');
  const delivered = allOrders.filter(o => o.status === 'delivered');

  const activeCountEl = document.getElementById('activeCount');
  const deliveredCountEl = document.getElementById('deliveredCount');
  activeCountEl.textContent = active.length;
  activeCountEl.style.display = active.length ? 'inline-block' : 'none';
  deliveredCountEl.textContent = delivered.length;
  deliveredCountEl.style.display = delivered.length ? 'inline-block' : 'none';

  const list = document.getElementById('list');
  const orders = currentTab === 'active' ? active : delivered;

  if (!orders.length) {
    list.innerHTML = `<div class="empty-state">${currentTab === 'active' ? '🎉 No active orders right now.' : 'No deliveries completed yet today.'}</div>`;
    return;
  }

  list.innerHTML = '';
  orders.forEach((o, idx) => {
    const seq = currentTab === 'active' ? idx + 1 : '';
    list.appendChild(buildCard(o, seq));
  });
}

// ─────────────────────────────── CARD ─────────────────────────────────
function buildCard(o, seq) {
  const div = document.createElement('div');
  const isNew = flashOrderId && o._id === flashOrderId;
  div.className = 'order-card' + (isNew ? ' new-flash' : '');
  const isDelivered = o.status === 'delivered';
  const isPrepaid = (o.paymentMethod || '').toUpperCase() === 'UPI';
  const itemsHtml = (o.items||[]).map(i =>
    `<div class="item-row"><span>${esc(i.name)}${i.variant?' ('+esc(i.variant)+')':''} × ${i.qty}</span><b>₹${i.price*i.qty}</b></div>`
  ).join('');

  let navUrl = '';
  if (o.location && o.location.lat && o.location.lng) {
    navUrl = `https://www.google.com/maps/dir/?api=1&destination=${o.location.lat},${o.location.lng}&travelmode=driving`;
  } else if (o.address) {
    navUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}`;
  }

  const payBadge = isPrepaid
    ? `<div class="pay-badge prepaid">✅ Prepaid (UPI)</div>`
    : `<div class="pay-badge cod">💵 Cash on Delivery</div>`;

  let actionsHtml = '';
  if (isDelivered) {
    actionsHtml = `<div class="delivered-tag">✅ Delivered${o.collectedAmount ? ' · Collected '+fmtRs(o.collectedAmount) : ''}</div>`;
  } else {
    const navBtn = navUrl ? `<button class="btn btn-nav" onclick="window.open('${navUrl}','_blank')">📍 Navigate</button>` : '';
    if (isPrepaid) {
      actionsHtml = `
        <div class="actions-row${navBtn ? '' : ' single'}">
          ${navBtn}
          <button class="btn btn-deliver" onclick="markDelivered('${o._id}', false, 0)">✅ Mark Delivered</button>
        </div>`;
    } else {
      actionsHtml = `
        <div class="collect-wrap">
          <label>Amount Collected (₹)</label>
          <input type="number" class="collect-input" id="collect_${o._id}" value="${o.total}" min="0">
        </div>
        <div class="actions-row${navBtn ? '' : ' single'}">
          ${navBtn}
          <button class="btn btn-deliver" onclick="markDelivered('${o._id}', true)">💰 Collect &amp; Deliver</button>
        </div>`;
    }
  }

  div.innerHTML = `
    <div class="order-top">
      <div style="display:flex;align-items:center;gap:8px;">
        ${seq ? `<div class="seq-badge">${seq}</div>` : ''}
        <span class="order-type-badge ${o.orderType}">${esc(o.orderType)}</span>
      </div>
      <span style="font-size:.7rem;color:var(--muted);">${fmtTime(o.createdAt)}</span>
    </div>
    <div class="cust-name">${esc(o.customerName || 'No name')}</div>
    ${o.mobile ? `<a class="cust-mobile" href="tel:${esc(o.mobile)}">📞 ${esc(o.mobile)}</a>` : ''}
    ${o.address ? `<div class="addr-box">📍 ${esc(o.address)}</div>` : ''}
    <div class="items-box">${itemsHtml}</div>
    <div class="total-row"><span class="lbl">Total</span><span class="val">${fmtRs(o.total)}</span></div>
    ${payBadge}
    ${actionsHtml}
  `;
  return div;
}

// ─────────────────────────────── MARK DELIVERED ───────────────────────
async function markDelivered(orderId, isCOD) {
  const payload = { status: 'delivered' };
  if (isCOD) {
    const input = document.getElementById('collect_' + orderId);
    const collected = input ? Math.max(0, Number(input.value) || 0) : 0;
    payload.collectedAmount = collected;
    payload.paymentVerified = true;
  }
  try {
    await apiFetch(`/api/orders/${orderId}`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    fetchOrders();
    switchDeliveryTab('active', document.querySelector('.tab-btn[data-tab="active"]'));
  } catch(e) { alert('Could not mark delivered: ' + e.message); }
}
window.markDelivered = markDelivered;
window.switchDeliveryTab = switchDeliveryTab;
</script>
</body>
</html>
